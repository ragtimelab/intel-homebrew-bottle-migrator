name: Bug report
description: Report a reproducible non-security defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities or include secrets and private host evidence here. Use private vulnerability reporting for security issues.
  - type: input
    id: release
    attributes:
      label: Skill release
      placeholder: v0.1.0
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Natural-language request
      description: Redact usernames, home paths, and credentials.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
